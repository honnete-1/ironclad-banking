<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IronClad Banking System</title>

  <!-- orbitron feels very "secure bank" for the logo text
       ibm plex sans is clean and readable for the main UI
       ibm plex mono is good for showing code and array output -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- sticky header with the logo and project badge -->
  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="brand-icon">IB</div>
        <div>
          <div class="brand-name">IRONCLAD</div>
          <div class="brand-sub">Banking System</div>
        </div>
      </div>
      <div class="header-badge">CS101 · ARRAY METHODS PROJECT</div>
    </div>
  </header>

  <!-- tab navigation, one button per question
       switchTab() in main.js handles the show/hide logic -->
  <nav class="tab-nav" role="navigation" aria-label="Section tabs">
    <div class="tab-nav-inner">
      <button class="tab-btn active" onclick="switchTab('atm')" aria-pressed="true">
        <span class="tab-num">1</span> Smart ATM
      </button>
      <button class="tab-btn" onclick="switchTab('loan')">
        <span class="tab-num">2</span> Loan Processing
      </button>
      <button class="tab-btn" onclick="switchTab('fraud')">
        <span class="tab-num">3</span> Fraud Detection
      </button>
      <button class="tab-btn" onclick="switchTab('merger')">
        <span class="tab-num">4</span> Bank Merger
      </button>
      <button class="tab-btn" onclick="switchTab('security')">
        <span class="tab-num">5</span> Security System
      </button>
    </div>
  </nav>
